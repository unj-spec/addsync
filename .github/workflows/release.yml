name: release

# v1.2.3 같은 태그를 밀면 설치 파일을 만들어 릴리스에 올린다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 아이콘 생성
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\make-icon.ps1

      - name: 프로그램 빌드
        shell: cmd
        run: build.cmd

      - name: Inno Setup 설치
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 설치 파일 빌드
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /Q installer.iss'

      - name: 산출물 보관
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe

      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
